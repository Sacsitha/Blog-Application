<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InkFlow</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="../css/profile.css" />
  </head>
  <body>
    <header class="navbar-header">
      <div class="container-fluid">
        <div class="row align-items-center">
          <div class="col-md-3 col-sm-12 d-flex align-items-center">
            <a href="../index.html" aria-label="InkFlow home">
              <img src="../assets/images/logo/logo.png" alt="InkFlow Logo" class="logo" />
            </a>
          </div>
          <div class="col-md-6 col-sm-12">
            <form class="search-bar d-flex align-items-center" id="searchForm">
              <input id="profileSearchInput" class="form-control me-2" name="q" type="search" placeholder="Search stories" aria-label="Search stories" />
              <button type="submit" class="profile-search-button" aria-label="Search">
                <img src="../assets/images/icons/search-svgrepo-com.svg" alt="" width="20" height="20" />
              </button>
            </form>
          </div>
          <div class="col-md-3 col-sm-12 d-flex justify-content-end align-items-center gap-3">
            <a href="story.html" class="btn btn-primary rounded-pill">Write</a>
            <a href="user_profile.html" aria-label="Open user profile">
              <img src="../assets/images/icons/profile-default-svgrepo-com.svg" alt="Profile" class="profile-logo" style="width: 40px; height: 40px; border-radius: 50%; cursor: pointer" />
            </a>
            <button class="btn btn-outline-danger btn-sm" id="logoutBtn">Logout</button>
          </div>
        </div>
      </div>
    </header>

    <!-- Vertical Navigation Sidebar -->
		<nav class="sidebar-nav" aria-label="Primary navigation">
			<ul class="nav-list">
				<li><a href="profile.html" class="nav-link">Home</a></li>
				<li><a href="user_profile.html" class="nav-link">Profile</a></li>
				<li><a href="story.html" class="nav-link">Stories</a></li>
				<li><a href="search_page.html" class="nav-link">Search</a></li>
			</ul>
		</nav>

    <!-- Right Profile Sidebar -->
    <aside class="profile-sidebar">
      <div class="profile-card">
        <img id="sidebarAvatar" src="../assets/images/icons/profile-default-svgrepo-com.svg" alt="Profile" class="profile-image" />
        <h3 id="sidebarName" class="profile-name">User Name</h3>
        <p id="sidebarBio" class="profile-bio">Your bio goes here</p>
        <a href="user_profile.html" class="btn btn-primary btn-edit">View Profile</a>
      </div>
    </aside>

    <main>
      <section class="blog-section mt-5">
        <div class="container">
          <div id="loadingMessage" style="text-align: center; padding: 40px;">
            <p>Loading stories...</p>
          </div>
          <div id="blogsContainer">
            <!-- Blogs will be loaded here dynamically -->
          </div>
          <div id="noBlogs" style="display:none; text-align: center; padding: 40px;">
            <p class="text-muted">No stories found. <a href="story.html">Create your first story!</a></p>
          </div>
        </div>
      </section>
    </main>
    <footer class="footer mt-5">
      <div class="container">
        <div class="row">
          <div class="col-12 text-center">
            <p>&copy; 2026 InkFlow. All rights reserved.</p>
          </div>
        </div>
      </div>
    </footer>
    <script src="../js/api-client.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        // Check authentication
        if (!APIClient.isAuthenticated()) {
          window.location.href = 'Login.html';
          return;
        }

        try {
          const user = APIClient.getUser();
          
          // Update sidebar with user info
          document.getElementById('sidebarName').textContent = user.full_name || user.username;
          document.getElementById('sidebarBio').textContent = user.bio || 'Your bio goes here';
          if (user.avatar_url) {
            document.getElementById('sidebarAvatar').src = user.avatar_url;
          }

          // Load only the logged-in user's blogs
          const response = await APIClient.getUserBlogs(user.user_id, 20, 0);
          const blogsContainer = document.getElementById('blogsContainer');
          const noBlogs = document.getElementById('noBlogs');
          const loadingMessage = document.getElementById('loadingMessage');

          loadingMessage.style.display = 'none';

          if (response.success && response.blogs.length > 0) {
            blogsContainer.innerHTML = response.blogs.map((blog, index) => `
              <a class="modern-card mb-4 text-decoration-none" href="view_blog.html?blog_id=${encodeURIComponent(blog.blog_id)}">
                <div class="card-image-wrapper">
                  <img src="${blog.cover_image_url || getFallbackImage(index)}" class="card-image" alt="${blog.title || 'Blog post'}" />
                </div>
                <div class="card-content">
                  <h5 class="card-title">${blog.title}</h5>
                  <p class="card-text">${blog.subtitle || blog.body.substring(0, 100) + '...'}</p>
                  <small class="text-muted">By <strong>${blog.full_name}</strong></small><br />
                  <span class="card-date">${new Date(blog.created_at).toLocaleDateString()}</span>
                </div>
              </a>
            `).join('');
          } else {
            noBlogs.style.display = 'block';
          }
        } catch (error) {
          console.error('Error loading blogs:', error);
          document.getElementById('loadingMessage').innerHTML = '<p class="text-danger">Error loading stories. Please try again.</p>';
        }
      });

      function getFallbackImage(index) {
        const images = [
          '../assets/images/backgrounds/download (1).jpg',
          '../assets/images/backgrounds/download (2).jpg',
          '../assets/images/backgrounds/download (3).jpg',
          '../assets/images/backgrounds/download (4).jpg',
          '../assets/images/backgrounds/journaling through everything.jpg',
          '../assets/images/backgrounds/I travel once every two months.jpg',
          '../assets/images/backgrounds/Fujifilm Instax Mini EVO Hybrid Instant Camera.jpg',
          '../assets/images/backgrounds/download.jpg'
        ];
        return images[index % images.length];
      }

      // Handle search
      document.getElementById('searchForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const query = document.getElementById('profileSearchInput').value;
        if (query.trim()) {
          window.location.href = `search_page.html?q=${encodeURIComponent(query)}`;
        }
      });

      // Handle logout
      document.getElementById('logoutBtn').addEventListener('click', () => {
        APIClient.clearAuth();
        window.location.href = 'Login.html';
      });
    </script>
  </body>
</html>
  </body>
</html>
