<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InkFlow</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header class="navbar-header">
      <div class="container-fluid">
        <div class="row align-items-center">
          <div class="col-md-3 col-sm-12 d-flex align-items-center">
            <img src="./assets/images/logo/logo.png" alt="InkFlow Logo" class="logo" />
          </div>
          <div class="col-md-6 col-sm-12">
            <div class="search-bar d-flex align-items-center">
              <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
              <img src="./assets/images/icons/search-svgrepo-com.svg" alt="Search Icon" width="20px" height="20px" />
            </div>
          </div>
          <div class="col-md-3 col-sm-12 d-flex justify-content-end align-items-center">
            <a id="signinBtn" href="pages/Login.html" class="btn btn-primary rounded-pill">SignIn/Up</a>
          </div>
        </div>
      </div>
    </header>

    <header class="image-carousel-header">
      <div class="carousel-container">
        <div class="card-wrapper" id="card1">
          <img src="./assets/images/backgrounds/download (1).jpg" alt="Card 1" class="carousel-card" />
        </div>
        <div class="card-wrapper" id="card2">
          <img src="./assets/images/backgrounds/download (2).jpg" alt="Card 2" class="carousel-card" />
        </div>
        <div class="card-wrapper" id="card3">
          <img src="./assets/images/backgrounds/download (3).jpg" alt="Card 3" class="carousel-card" />
        </div>
        <div class="card-wrapper" id="card4">
          <img src="./assets/images/backgrounds/download (4).jpg" alt="Card 4" class="carousel-card" />
        </div>
        <div class="card-wrapper" id="card5">
          <img src="./assets/images/backgrounds/I travel once every two months.jpg" alt="Card 5" class="carousel-card" />
        </div>
        <div class="card-wrapper" id="card6">
          <img src="./assets/images/backgrounds/Fujifilm Instax Mini EVO Hybrid Instant Camera.jpg" alt="Card 6" class="carousel-card" />
        </div>
        <div class="card-wrapper" id="card7">
          <img src="./assets/images/backgrounds/journaling through everything.jpg" alt="Card 7" class="carousel-card" />
        </div>
        <div class="card-wrapper" id="card8">
          <img src="./assets/images/backgrounds/download.jpg" alt="Card 8" class="carousel-card" />
        </div>
      </div>

      <!-- Centered Logo -->
      <div class="carousel-logo">
        <img src="./assets/images/logo/logo.png" alt="InkFlow Logo" />
      </div>

      <!-- Fullscreen Modal -->
      <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
          <span class="close-modal">&times;</span>
          <img id="modalImage" src="" alt="Full View" />
        </div>
      </div>
    </header>
    <main>
      <section class="blog-section mt-5">
        <div class="container">
          <div class="row" id="blogGrid">
            <div class="col-12 text-center" id="blogStatus">Loading stories...</div>
          </div>
        </div>
      </section>
    </main>
    <footer class="footer mt-5">
      <div class="container">
        <div class="row">
          <div class="col-12 text-center">
            <p>&copy; 2026 InkFlow. All rights reserved.</p>
          </div>
        </div>
      </div>
    </footer>
    <script src="./js/api-client.js"></script>
    <script src="./js/script.js"></script>
    <script>
      // Check if user is authenticated on load
      document.addEventListener('DOMContentLoaded', function() {
        const signinBtn = document.getElementById('signinBtn');
        if (APIClient.isAuthenticated()) {
          const user = APIClient.getUser();
          signinBtn.textContent = user ? user.username : 'Dashboard';
          signinBtn.href = 'pages/profile.html';
          signinBtn.classList.remove('btn-primary');
          signinBtn.classList.add('btn-secondary');
        }

        loadBlogs();
      });

      async function loadBlogs() {
        const blogGrid = document.getElementById('blogGrid');
        try {
          const response = await APIClient.getAllBlogs(20, 0);
          if (!response.success || !response.blogs || response.blogs.length === 0) {
            blogGrid.innerHTML = '<div class="col-12 text-center"><p>No stories have been published yet.</p></div>';
            return;
          }

          blogGrid.innerHTML = response.blogs.map((blog, index) => {
            const preview = (blog.body || '').trim().slice(0, 180);
            const published = blog.created_at ? new Date(blog.created_at).toLocaleDateString() : '';
            return `
              <div class="col-md-6 col-sm-12 mb-4">
                <a class="card h-100 text-decoration-none text-reset" href="pages/view_blog.html?blog_id=${encodeURIComponent(blog.blog_id)}">
                  <img src="${escapeHtml(blog.cover_image_url || getFallbackImage(index))}" class="card-img-top" style="height: 220px; object-fit: cover;" alt="${escapeHtml(blog.title || 'Blog post')}" />
                  <div class="card-body">
                    <p class="text-muted mb-2">By ${escapeHtml(blog.full_name || blog.username || 'InkFlow writer')}</p>
                    <h5 class="card-title">${escapeHtml(blog.title || 'Untitled story')}</h5>
                    <p class="card-text">${escapeHtml(blog.subtitle || preview)}</p>
                    <p class="card-text"><small class="text-muted">${escapeHtml(published)}</small></p>
                  </div>
                </a>
              </div>`;
          }).join('');
        } catch (error) {
          console.error('Failed to load blogs:', error);
          blogGrid.innerHTML = '<div class="col-12 text-center"><p>Stories are temporarily unavailable.</p></div>';
        }
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (character) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
        }[character]));
      }

      function getFallbackImage(index) {
        const images = [
          './assets/images/backgrounds/download (1).jpg',
          './assets/images/backgrounds/download (2).jpg',
          './assets/images/backgrounds/download (3).jpg',
          './assets/images/backgrounds/download (4).jpg',
          './assets/images/backgrounds/journaling through everything.jpg',
          './assets/images/backgrounds/I travel once every two months.jpg',
          './assets/images/backgrounds/Fujifilm Instax Mini EVO Hybrid Instant Camera.jpg',
          './assets/images/backgrounds/download.jpg'
        ];
        return images[index % images.length];
      }
    </script>
  </body>
</html>
