<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Story | InkFlow</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/view_blog.css" />
  </head>
  <body>
    <header class="navbar-header">
      <div class="container-fluid">
        <div class="row align-items-center">
          <div class="col-md-3 col-sm-12 d-flex align-items-center">
            <a href="../index.html" aria-label="InkFlow home">
              <img src="../assets/images/logo/logo.png" alt="InkFlow Logo" class="logo" />
            </a>
          </div>
          <div class="col-md-6 col-sm-12 text-center">
            <span class="text-muted">Read a story</span>
          </div>
          <div class="col-md-3 col-sm-12 d-flex justify-content-end align-items-center">
            <a href="../index.html" class="btn btn-outline-primary">Home</a>
          </div>
        </div>
      </div>
    </header>

    <main class="blog-view-main">
      <a class="blog-view-back" href="javascript:history.back()">&larr; Back</a>
      <article id="blogArticle" class="blog-view-card" hidden></article>
      <div id="blogMessage" class="blog-view-message">Loading story...</div>
    </main>

    <script src="../js/api-client.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', loadBlog);

      async function loadBlog() {
        const blogId = new URLSearchParams(window.location.search).get('blog_id');
        const article = document.getElementById('blogArticle');
        const message = document.getElementById('blogMessage');

        if (!blogId) {
          message.textContent = 'No story was selected.';
          return;
        }

        try {
          const response = await APIClient.getBlog(blogId);
          if (!response.success || !response.blog) {
            throw new Error(response.error || 'Story not found');
          }

          const blog = response.blog;
          const published = blog.created_at ? new Date(blog.created_at).toLocaleDateString() : '';
          const fallbackImage = '../assets/images/backgrounds/download (1).jpg';
          const image = blog.cover_image_url || fallbackImage;

          article.innerHTML = `
            <img class="blog-view-image" src="${escapeHtml(image)}" alt="${escapeHtml(blog.title || 'Blog story')}" />
            <div class="blog-view-content">
              <p class="blog-view-eyebrow">InkFlow story</p>
              <h1 class="blog-view-title">${escapeHtml(blog.title || 'Untitled story')}</h1>
              ${blog.subtitle ? `<p class="blog-view-subtitle">${escapeHtml(blog.subtitle)}</p>` : ''}
              <div class="blog-view-meta">By <strong>${escapeHtml(blog.full_name || blog.username || 'InkFlow writer')}</strong> · ${escapeHtml(published)}</div>
              <div class="blog-view-body">${escapeHtml(blog.body || '')}</div>
            </div>`;
          article.hidden = false;
          message.hidden = true;
          document.title = `${blog.title || 'Story'} | InkFlow`;
        } catch (error) {
          console.error('Failed to load story:', error);
          message.textContent = error.message || 'This story could not be loaded.';
        }
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (character) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
        }[character]));
      }
    </script>
  </body>
</html>
