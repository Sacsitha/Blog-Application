<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InkFlow Sign Up</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="login-page">
      <div class="login-box">
        <h2>Sign Up</h2>
        <p class="text-muted">Welcome to <a href="index.html" class="color">InkFlow</a></p>
        <form>
          <div class="mb-3">
            <label for="name" class="form-label">Username</label>
            <input type="text" class="form-control" id="name" placeholder="Enter your username" />
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" placeholder="Enter your password" />
          </div>
          <div class="mb-3">
            <label for="confirm-password" class="form-label">Confirm Password</label>
            <input type="password" class="form-control" id="confirm-password" placeholder="Confirm your password" />
          </div>
          <button type="button" class="btn btn-primary w-100" data-bs-toggle="modal" data-bs-target="#interestModal">Sign Up</button>
          <div class="mt-3">
            <p class="text-muted">Already have an account? <a href="index.html" class="text-danger">Login</a></p>
          </div>
        </form>
      </div>
    </main>

    <!-- Interest Modal -->
    <div class="modal fade" id="interestModal" tabindex="-1" aria-labelledby="interestModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="interestModalLabel">Select Your Interests</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <p class="text-muted mb-3">What topics are you interested in?</p>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="interest-tech" name="interests" value="Technology" />
              <label class="form-check-label" for="interest-tech">Technology</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="interest-business" name="interests" value="Business" />
              <label class="form-check-label" for="interest-business">Business</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="interest-health" name="interests" value="Health" />
              <label class="form-check-label" for="interest-health">Health & Wellness</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="interest-entertainment" name="interests" value="Entertainment" />
              <label class="form-check-label" for="interest-entertainment">Entertainment</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="interest-sports" name="interests" value="Sports" />
              <label class="form-check-label" for="interest-sports">Sports</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="interest-travel" name="interests" value="Travel" />
              <label class="form-check-label" for="interest-travel">Travel</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="interest-food" name="interests" value="Food" />
              <label class="form-check-label" for="interest-food">Food & Cooking</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="interest-education" name="interests" value="Education" />
              <label class="form-check-label" for="interest-education">Education</label>
            </div>
            <p class="text-danger mb-3">Choose atleast one</p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary" onclick="completeSignUp()">Complete Sign Up</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      function completeSignUp() {
        const selectedInterests = Array.from(document.querySelectorAll('input[name="interests"]:checked')).map(cb => cb.value);
        console.log('Selected interests:', selectedInterests);
        // Add your sign-up logic here
        alert('Sign up successful with interests: ' + selectedInterests.join(', '));
      }
    </script>
