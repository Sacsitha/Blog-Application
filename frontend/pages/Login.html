<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InkFlow Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <main class="login-page">
      <div class="login-box">
        <h2>Login</h2>
        <p class="text-muted">Welcome back to <a href="../index.html" class="color">InkFlow</a></p>
        <form id="loginForm">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" placeholder="Enter your username" required />
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" placeholder="Enter your password" required />
          </div>
          <div id="errorMessage" class="mb-3 alert alert-danger" style="display:none;"></div>
          <button type="submit" class="btn btn-primary w-100" id="loginBtn">Login</button>
          <div class="mt-3">
            <p class="text-muted">Don't have an account? <a href="sign_up.html" class="text-danger">Sign up</a></p>      
          </div>
        </form>
      </div>
    </main>

    <script src="../js/api-client.js"></script>
    <script>
      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const loginBtn = document.getElementById('loginBtn');
        const errorMessage = document.getElementById('errorMessage');
        
        try {
          loginBtn.disabled = true;
          loginBtn.textContent = 'Logging in...';
          errorMessage.style.display = 'none';
          
          const response = await APIClient.login(username, password);
          
          if (response.success) {
            // Save user and token
            APIClient.setUser(response.user);
            APIClient.setToken(response.token);
            
            // Redirect to profile page
            window.location.href = 'profile.html';
          }
        } catch (error) {
          errorMessage.textContent = error.message || 'Login failed. Please check your credentials.';
          errorMessage.style.display = 'block';
          loginBtn.disabled = false;
          loginBtn.textContent = 'Login';
        }
      });
    </script>
  </body>
</html>
